apiVersion: v2
name: osuite-k8s
description: Kubernetes cluster monitoring - ships metrics, logs, and k8s objects to Osuite via OpenTelemetry.
type: application
version: 0.1.3
appVersion: 1.0.0

dependencies:
  - name: kube-state-metrics
    version: 7.2.0
    repository: https://prometheus-community.github.io/helm-charts
    condition: kube-state-metrics.enabled
