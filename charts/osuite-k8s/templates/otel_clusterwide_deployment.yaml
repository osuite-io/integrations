apiVersion: apps/v1
kind: Deployment
metadata:
  name: otel-clusterwide
  namespace: {{ .Release.Namespace }}
spec:
  # Singleton. Don't change.
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: otel-clusterwide
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: otel-clusterwide
        app.kubernetes.io/instance: {{ .Release.Name }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/otel_clusterwide.yaml") . | sha256sum }}
    spec:
      serviceAccountName: otel-collector-sa
      tolerations:
        - operator: Exists
          effect: NoSchedule
      containers:
        - name: otel-collector
          image: otel/opentelemetry-collector-contrib:0.148.0
          args: ["--config=/etc/otel/config.yaml"]
          volumeMounts:
            - name: config
              mountPath: /etc/otel
      volumes:
        - name: config
          configMap:
            name: otel-clusterwide
